[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiovents"
version = "0.1.0"
description = "Async UDP client for Vents air handling units"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Voluzi"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.9", "build>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
